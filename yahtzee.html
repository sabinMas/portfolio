<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Sixtyfour&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <title>Yahtzee Game</title>
    <link rel="stylesheet" href="yahtzee.css" />
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="mobile.css" />
  </head>
  <body>
    <div class="scaled-container">
      <div id="main-menu" class="menu active">
        <h1>YAHTZEE MAIN MENU</h1>
        <button onclick="showAddPlayers()">Add Players</button>
        <button onclick="displayRules()">Read Rules</button>
        <button onclick="startGame()">Play Game</button>
        <button onclick="exitGame()">Exit Game</button>
      </div>

      <div id="add-players" class="hidden">
        <h2>Add Players</h2>
        <label for="numPlayers">Number of players (1-6):</label>
        <input type="number" id="numPlayers" min="1" max="6" />
        <div id="player-names"></div>
        <button onclick="submitPlayers()">Submit Players</button>
        <button onclick="backToMenu()">Back</button>
      </div>

      <div id="rules" class="hidden">
        <h2>Yahtzee Rules</h2>
        <pre id="rules-text"></pre>
        <button onclick="backToMenu()">Back</button>
      </div>

      <div id="game-area" class="hidden">
        <h2 id="round-display">Round 1</h2>
        <div id="players-turn"></div>
        <div id="dice-area"></div>
        <div id="actions">
          <button onclick="rollDice()">Roll Dice</button>
          <button onclick="reRollDice()">Re-Roll Dice</button>
          <button onclick="selectCategory()">Select Category</button>
          <button onclick="viewScore()">View Score</button>
          <button onclick="viewCategories()">View Categories</button>
        </div>
        <div id="score-area"></div>
      </div>

      <script src="yahtzee.js"></script>
      <a href="page-selection.html" class="back-button">
        <img
          src="https://cdn.glitch.global/c404e7e0-5a28-4a5f-bc05-c17110073fbd/EyeSticker.PNG?v=1749055944931"
          alt="Back Button"
        /><span>go back</span>
      </a>
      <footer class="bio-footer">
        <p>©2025 Studio Sabin</p>
      </footer>
    </div>
  </body>
</html>
